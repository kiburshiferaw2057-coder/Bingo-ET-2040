name: Build Bingo ET Full App APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-bingo-et:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full Bingo ET repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Platform 35 & Build Tools 35.0.0
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify full Bingo ET app project structure
        run: |
          ls -la
          ls -la app/src/main/java/et/bingo/app/
          ls -la app/src/main/java/et/bingo/app/engine/
          ls -la app/src/main/java/et/bingo/app/model/

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Bingo ET Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BingoET-Full-App-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
